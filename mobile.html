<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYPEBLACK (ไฮป์แบล็ค) | Mobile App Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Kanit', sans-serif;
    }
    .phone-shadow-luxury {
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.95), 
                  0 0 50px rgba(229, 184, 105, 0.15),
                  0 0 0 12px #161722,
                  0 0 0 14px #262838;
    }
  </style>
</head>
<body class="bg-[#050608] text-slate-100 min-h-screen flex flex-col items-center justify-start p-3 sm:p-6 overflow-x-hidden selection:bg-[#E5B869] selection:text-black">

  <!-- Header Controls Bar -->
  <header class="w-full max-w-5xl flex flex-wrap items-center justify-between gap-4 py-3 px-6 bg-[#0D0E15]/90 backdrop-blur-md rounded-2xl border border-[#242636] shadow-2xl mb-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#E5B869] to-[#FFF0D0] flex items-center justify-center font-black text-black text-xl shadow-lg shadow-[#E5B869]/20">
        HB
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-black tracking-wide text-white flex items-center gap-2">
          HYPEBLACK (ไฮป์แบล็ค) <span class="text-[10px] bg-[#00E599]/20 text-[#00E599] border border-[#00E599]/40 px-2 py-0.5 rounded-full font-bold">✓ VERIFIED APP</span>
        </h1>
        <p class="text-[11px] text-slate-400">จำลองมุมมองแอปมือถือ HYPEBLACK แบรนด์เนม & สนีกเกอร์แท้ 100%</p>
      </div>
    </div>

    <!-- Device Selector Buttons -->
    <div class="flex items-center gap-1.5 bg-[#12131A] p-1 rounded-xl border border-[#242636] text-xs">
      <button onclick="setDevice('iphone')" id="btn-iphone" class="device-btn active px-3 py-1.5 rounded-lg font-bold transition-all bg-white text-black shadow-md">
        📱 iPhone 16 Pro
      </button>
      <button onclick="setDevice('galaxy')" id="btn-galaxy" class="device-btn px-3 py-1.5 rounded-lg font-bold transition-all text-slate-400 hover:text-white hover:bg-slate-800">
        🤖 Galaxy S24
      </button>
      <button onclick="setDevice('compact')" id="btn-compact" class="device-btn px-3 py-1.5 rounded-lg font-bold transition-all text-slate-400 hover:text-white hover:bg-slate-800">
        📱 Compact (SE)
      </button>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2">
      <button onclick="reloadFrame()" title="รีเฟรชหน้าจอ" class="p-2 rounded-xl bg-[#141520] hover:bg-slate-800 text-slate-300 hover:text-white border border-[#242636] transition-colors flex items-center gap-1.5 text-xs font-semibold">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <span class="hidden sm:inline">รีเฟรช</span>
      </button>
      <a href="http://localhost:3000/index.html" target="_blank" class="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-200 text-black font-extrabold text-xs shadow-xl transition-all flex items-center gap-1.5">
        <span>เปิดเต็มจอ ↗</span>
      </a>
    </div>
  </header>

  <!-- Smartphone Realistic Mockup Frame -->
  <div class="relative flex-1 flex items-center justify-center py-2">

    <!-- Subtle Ambient Glow -->
    <div class="absolute -inset-4 bg-gradient-to-r from-[#E5B869]/10 via-[#00E599]/10 to-indigo-950/20 blur-3xl -z-10 rounded-full pointer-events-none"></div>

    <!-- The Phone Body -->
    <div id="phone-container" class="phone-shadow-luxury relative bg-black rounded-[52px] border-[10px] border-[#0F1017] transition-all duration-300 overflow-hidden flex flex-col" style="width: 393px; height: 844px;">
      
      <!-- Top Speaker Notch -->
      <div class="absolute top-2 left-1/2 -translate-x-1/2 w-20 h-1 bg-[#1C1D2A] rounded-full z-40 pointer-events-none"></div>

      <!-- Smartphone Status Bar -->
      <div class="h-11 bg-[#08090C] text-white px-7 flex items-center justify-between text-xs font-semibold z-30 select-none border-b border-white/5">
        <span id="current-clock" class="tracking-tight text-[11px] font-bold">18:30</span>
        
        <!-- Dynamic Island -->
        <div class="w-24 h-5 bg-[#12131A] border border-[#242636] rounded-full flex items-center justify-center gap-1.5 px-2">
          <div class="w-2 h-2 rounded-full bg-black"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-emerald-950"></div>
        </div>

        <!-- System Icons -->
        <div class="flex items-center gap-2 text-slate-300">
          <span class="text-[9px] font-black tracking-wider text-[#00E599]">5G</span>
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M17.778 8.222c-4.296-4.296-11.26-4.296-15.556 0A1 1 0 01.808 6.808c5.076-5.077 13.308-5.077 18.384 0a1 1 0 01-1.414 1.414zM14.95 11.05a7 7 0 00-9.9 0 1 1 0 01-1.414-1.414 9 9 0 0112.728 0 1 1 0 01-1.414 1.414zm-2.829 2.828a3 3 0 00-4.242 0 1 1 0 01-1.415-1.414 5 5 0 017.072 0 1 1 0 01-1.415 1.414zM9 16a1 1 0 112 0 1 1 0 01-2 0z" clip-rule="evenodd"></path></svg>
          <div class="w-5 h-2.5 border border-slate-300 rounded-sm p-0.5 flex items-center">
            <div class="w-3.5 h-1.5 bg-[#00E599] rounded-2xs"></div>
          </div>
        </div>
      </div>

      <!-- App Content iFrame -->
      <div class="flex-1 w-full bg-[#08090C] relative overflow-hidden">
        <iframe id="app-frame" src="http://localhost:3000/index.html" class="w-full h-full border-0 select-none"></iframe>
      </div>

      <!-- Bottom Gesture Home Bar -->
      <div class="h-6 bg-[#08090C] flex items-center justify-center select-none z-30">
        <div class="w-32 h-1 bg-slate-600 rounded-full opacity-80"></div>
      </div>

    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const clockEl = document.getElementById('current-clock');
      if (clockEl) clockEl.textContent = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 10000);

    const devices = {
      iphone: { width: '393px', height: '844px', radius: '52px' },
      galaxy: { width: '412px', height: '890px', radius: '48px' },
      compact: { width: '360px', height: '740px', radius: '42px' }
    };

    function setDevice(type) {
      const container = document.getElementById('phone-container');
      const spec = devices[type] || devices.iphone;
      
      container.style.width = spec.width;
      container.style.height = spec.height;
      container.style.borderRadius = spec.radius;

      document.querySelectorAll('.device-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-black', 'shadow-md');
        btn.classList.add('text-slate-400');
      });

      const activeBtn = document.getElementById(`btn-${type}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('bg-white', 'text-black', 'shadow-md');
      }
    }

    function reloadFrame() {
      const frame = document.getElementById('app-frame');
      frame.src = frame.src;
    }
  </script>
</body>
</html>
